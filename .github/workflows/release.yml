name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-13
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install appdmg (macOS DMG builds only)
        if: runner.os == 'macOS'
        run: npm install appdmg

      - name: Build distributables
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*
