name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install appdmg (macOS DMG builds only)
        if: runner.os == 'macOS'
        run: npm install appdmg

      - name: Build distributables
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Ad-hoc sign macOS app bundle
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find out -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep "$APP_PATH"
          fi

      - name: Re-create DMG after signing
        if: runner.os == 'macOS'
        run: |
          # The DMG was already made before signing, so re-create it
          DMG_PATH=$(find out/make -name "*.dmg" | head -1)
          APP_PATH=$(find out -name "*.app" -type d | head -1)
          if [ -n "$DMG_PATH" ] && [ -n "$APP_PATH" ]; then
            ARCH="${{ matrix.arch }}"
            rm -f "$DMG_PATH"
            hdiutil create -volname "MIDI Hooks" -srcfolder "$APP_PATH" -ov -format UDZO "out/make/MIDI Hooks-$ARCH.dmg"
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.nupkg
